name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Arrange structure
        run: |
          mkdir -p android-app/app/src/main/java/com/zszz/legion android-app/app/src/main/res/drawable android-app/app/src/main/res/values
          [ -f root_build.gradle ] && mv root_build.gradle android-app/build.gradle
          [ -f root_settings.gradle ] && mv root_settings.gradle android-app/settings.gradle
          [ -f root_gradle.properties ] && mv root_gradle.properties android-app/gradle.properties
          [ -f app_build.gradle ] && mv app_build.gradle android-app/app/build.gradle
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml android-app/app/src/main/AndroidManifest.xml
          [ -f MainActivity.java ] && mv MainActivity.java android-app/app/src/main/java/com/zszz/legion/MainActivity.java
          [ -f strings.xml ] && mv strings.xml android-app/app/src/main/res/values/strings.xml
          [ -f ic_launcher.png ] && mv ic_launcher.png android-app/app/src/main/res/drawable/ic_launcher.png
      - name: Build APK
        run: cd android-app && gradle assembleDebug --no-daemon
      - name: Commit APK
        run: |
          mkdir -p apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk/zhongshen_legion.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/zhongshen_legion.apk android-app
          git diff --cached --quiet || git commit -m "自动构建：安卓APK更新"
          git push
